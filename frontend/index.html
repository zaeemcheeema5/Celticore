<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <!-- SEO -->
  <meta
    name="robots"
    content="index, follow"
  />

  <title>CeltiCore | Premium Fitness Supplements Ireland</title>

  <meta
    name="description"
    content="Shop premium fitness supplements, whey protein, creatine, vitamins, wellness products and sports nutrition at CeltiCore Ireland."
  />

  <meta
    name="keywords"
    content="CeltiCore, fitness supplements Ireland, whey protein Ireland, creatine Ireland, vitamins Ireland, sports nutrition, fitness supplements"
  />

  <meta
    name="author"
    content="CeltiCore"
  />

  <!-- Canonical -->
  <link
    rel="canonical"
    href="https://thecelticore.com/"
  />

  <!--
    Brand fonts — Barlow Condensed (headings) + DM Sans (body/labels).
    Every page's inline styles already reference these two families, but
    until now nothing actually loaded them: NutritionModal.tsx was the
    only component pulling them in, via its own @import inside a <style>
    tag scoped to that page. Every other page silently fell back to the
    browser's default sans-serif, which is why fonts/weights looked
    inconsistent across the site. Loading them once here, site-wide,
    fixes every page at once instead of patching component-by-component.
  -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700;800;900&display=swap"
  />


  <!-- Open Graph -->
  <meta
    property="og:type"
    content="website"
  />

  <meta
    property="og:title"
    content="CeltiCore | Premium Fitness Supplements Ireland"
  />

  <meta
    property="og:description"
    content="Shop premium fitness supplements, whey protein, creatine, vitamins, wellness products and sports nutrition at CeltiCore Ireland."
  />

  <meta
    property="og:url"
    content="https://thecelticore.com/"
  />

  <meta
    property="og:image"
    content="https://thecelticore.com/android-chrome-512x512.png"
  />

  <meta
    property="og:site_name"
    content="CeltiCore"
  />

  <!-- Twitter -->
  <meta
    name="twitter:card"
    content="summary_large_image"
  />

  <meta
    name="twitter:title"
    content="CeltiCore | Premium Fitness Supplements Ireland"
  />

  <meta
    name="twitter:description"
    content="Shop premium fitness supplements, whey protein, creatine, vitamins, wellness products and sports nutrition at CeltiCore Ireland."
  />

  <meta
    name="twitter:image"
    content="https://thecelticore.com/android-chrome-512x512.png"
  />

  <!-- Favicons -->
  <link
    rel="icon"
    href="/favicon.ico"
  />

  <link
    rel="apple-touch-icon"
    href="/apple-touch-icon.png"
  />

  <link
    rel="manifest"
    href="/site.webmanifest"
  />
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Organization",
  "@id": "https://thecelticore.com/#organization",
  "name": "CeltiCore",
  "url": "https://thecelticore.com/",
  "logo": "https://thecelticore.com/android-chrome-512x512.png"
}
</script>

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebSite",
  "@id": "https://thecelticore.com/#website",
  "name": "CeltiCore",
  "url": "https://thecelticore.com/",
  "publisher": {
    "@id": "https://thecelticore.com/#organization"
  }
}
</script>
</head>

<body>

  <div id="root"></div>

  <!-- Vite React entry point -->
  <script
    type="module"
    src="/src/main.tsx"
  ></script>

</body>
</html>
